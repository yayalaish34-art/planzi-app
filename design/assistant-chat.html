<title>Planzi Voice Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&display=swap">

<style>
  /* ────────────────────────────────────────────────────────────────
     Tokens, read off the reference render.
     Single visual world on purpose: this is a device mock, so it
     paints the same in light, dark and un-stamped hosts.
     ──────────────────────────────────────────────────────────────── */
  :root {
    --ground:        #0A0A0C;   /* the page behind the phone      */
    --screen-top:    #FAF9FD;
    --screen-bottom: #F2F0FA;

    --ink:           #1E1E32;   /* headline + bubble text         */
    --ink-soft:      #3A3A50;
    --muted:         #9B9AAE;   /* timestamps, placeholder        */
    --nav-icon:      #A3A2B6;

    --violet:        #6A5AE0;   /* the mic glyph, the undo arrow  */
    --violet-soft:   #8E7BEA;
    --bot-top:       #E7E1F8;   /* assistant bubble, top stop     */
    --bot-bottom:    #DCD3F3;
    --surface:       #FFFFFF;

    --shadow-card:   0 8px 24px rgba(76, 62, 145, .07), 0 2px 6px rgba(76, 62, 145, .04);
    --shadow-lift:   0 10px 30px rgba(76, 62, 145, .12), 0 3px 8px rgba(76, 62, 145, .06);

    --font: 'Assistant', 'Rubik', 'Heebo', 'Segoe UI', system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--ground);
    font-family: var(--font);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 16px;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Device ─────────────────────────────────────────────────── */
  .phone {
    width: 390px;
    height: 782px;
    background: #000;
    border-radius: 40px;
    padding: 5px;
    flex: none;
  }

  .screen {
    width: 100%;
    height: 100%;
    border-radius: 35px;
    overflow: hidden;
    background: linear-gradient(180deg, var(--screen-top) 0%, var(--screen-bottom) 100%);
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* ── Top bar ────────────────────────────────────────────────── */
  .topbar {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 26px 20px 10px;
  }

  .round-btn {
    width: 40px;
    height: 40px;
    flex: none;
    border: 0;
    border-radius: 50%;
    background: var(--surface);
    box-shadow: var(--shadow-card);
    display: grid;
    place-items: center;
    cursor: pointer;
    color: var(--ink);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .round-btn:hover  { transform: translateY(-1px); box-shadow: var(--shadow-lift); }
  .round-btn:active { transform: translateY(0) scale(.96); }
  .round-btn:focus-visible { outline: 2px solid var(--violet); outline-offset: 3px; }
  .round-btn.undo { color: var(--violet); }

  .title {
    margin: 0;
    font-size: 21px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: -0.2px;
  }

  /* ── Thread ─────────────────────────────────────────────────── */
  .thread {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 12px 20px 4px;
    scrollbar-width: none;
  }
  .thread::-webkit-scrollbar { display: none; }

  .row { display: flex; align-items: flex-start; gap: 8px; max-width: 78%; }
  .row.me  { align-self: flex-end;   }
  .row.bot { align-self: flex-start; }

  .avatar {
    width: 33px;
    height: 33px;
    flex: none;
    margin-top: 14px;
    border-radius: 50%;
    background: var(--surface);
    box-shadow: var(--shadow-card);
    display: grid;
    place-items: center;
    color: var(--violet-soft);
  }

  .bubble {
    border-radius: 22px;
    padding: 13px 17px 8px;
    font-size: 14.5px;
    line-height: 1.55;
    color: var(--ink);
  }
  .bubble.me {
    background: var(--surface);
    box-shadow: var(--shadow-card);
  }
  .bubble.bot {
    background: linear-gradient(180deg, var(--bot-top) 0%, var(--bot-bottom) 100%);
    color: var(--ink-soft);
  }
  .bubble p { margin: 0; }
  .bubble b { font-weight: 700; color: var(--ink); }

  /* The timestamp sits at the bubble's left edge in both roles. */
  .meta {
    display: flex;
    align-items: center;
    gap: 5px;
    margin-top: 5px;
    font-size: 11.5px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .meta svg { flex: none; }

  /* ── Voice stage ────────────────────────────────────────────── */
  .voice {
    flex: none;
    position: relative;
    height: 210px;
    display: grid;
    place-items: center;
  }

  .wave {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .mic-stage {
    position: relative;
    width: 128px;
    height: 128px;
    display: grid;
    place-items: center;
    margin-bottom: 22px;
  }

  /* The violet bloom under the button. */
  .mic-stage::before {
    content: "";
    position: absolute;
    inset: -14px;
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(138, 112, 240, .40) 0%,
      rgba(138, 112, 240, .18) 46%,
      rgba(138, 112, 240, 0) 70%);
    filter: blur(6px);
    animation: breathe 4.5s ease-in-out infinite;
    transition: opacity .3s ease;
  }

  /* While she is listening the bloom holds bright instead of breathing. */
  .mic-stage.on::before {
    animation-duration: 1.6s;
    background: radial-gradient(circle,
      rgba(138, 112, 240, .58) 0%,
      rgba(138, 112, 240, .26) 46%,
      rgba(138, 112, 240, 0) 72%);
  }

  .dotted-ring {
    position: absolute;
    inset: -22px;
    color: rgba(122, 100, 214, .38);
  }

  .mic-btn {
    position: relative;
    width: 96px;
    height: 96px;
    border: 0;
    border-radius: 50%;
    background: var(--surface);
    display: grid;
    place-items: center;
    cursor: pointer;
    color: var(--violet);
    box-shadow:
      0 0 0 9px rgba(255, 255, 255, .62),
      0 0 0 10px rgba(150, 128, 240, .22),
      0 14px 34px rgba(106, 90, 224, .32),
      inset 0 -3px 10px rgba(120, 100, 220, .10);
    transition: transform .18s ease;
  }
  .mic-btn:hover  { transform: scale(1.03); }
  .mic-btn:active { transform: scale(.97); }
  .mic-btn:focus-visible { outline: 2px solid var(--violet); outline-offset: 12px; }

  /* Inner hairline ring, as in the reference. */
  .mic-btn::after {
    content: "";
    position: absolute;
    inset: 9px;
    border-radius: 50%;
    border: 1px solid rgba(126, 106, 216, .13);
  }

  .hint {
    position: absolute;
    bottom: 10px;
    margin: 0;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink);
  }

  /* ── Composer ───────────────────────────────────────────────── */
  .composer {
    flex: none;
    margin: 0 20px 12px;
    height: 54px;
    padding: 0 6px;
    border-radius: 27px;
    background: var(--surface);
    box-shadow: var(--shadow-card);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .send {
    width: 42px;
    height: 42px;
    flex: none;
    border: 0;
    border-radius: 50%;
    background: linear-gradient(145deg, #C9B9F7 0%, #A38DEE 100%);
    color: #FFFFFF;
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: transform .15s ease, filter .15s ease;
  }
  .send:hover  { filter: brightness(1.05); transform: translateY(-1px); }
  .send:active { transform: translateY(0) scale(.95); }
  .send:focus-visible { outline: 2px solid var(--violet); outline-offset: 3px; }
  .send svg { transform: scaleX(-1); }

  .composer input {
    flex: 1 1 auto;
    min-width: 0;
    border: 0;
    background: transparent;
    outline: none;
    font-family: inherit;
    font-size: 14.5px;
    color: var(--ink);
    text-align: right;
    padding-inline-end: 12px;
  }
  .composer input::placeholder { color: var(--muted); }

  /* ── Tab bar ────────────────────────────────────────────────── */
  .tabbar {
    flex: none;
    position: relative;
    margin: 0 16px 18px;
    height: 62px;
    border-radius: 31px;
    background: var(--surface);
    box-shadow: 0 6px 22px rgba(76, 62, 145, .10);
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 0 8px;
  }

  .tab {
    border: 0;
    background: none;
    padding: 8px;
    border-radius: 14px;
    cursor: pointer;
    color: var(--nav-icon);
    display: grid;
    place-items: center;
    transition: color .15s ease;
  }
  .tab:hover { color: var(--violet-soft); }
  .tab:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }

  .tab-mic {
    width: 50px;
    height: 50px;
    flex: none;
    border: 0;
    border-radius: 50%;
    background: linear-gradient(150deg, #BFAEF5 0%, #9B8CEE 52%, #7FA8EF 100%);
    color: #FFFFFF;
    display: grid;
    place-items: center;
    cursor: pointer;
    transform: translateY(-9px);
    box-shadow: 0 8px 20px rgba(122, 106, 232, .38);
    transition: transform .16s ease;
  }
  .tab-mic:hover  { transform: translateY(-11px); }
  .tab-mic:active { transform: translateY(-9px) scale(.95); }
  .tab-mic:focus-visible { outline: 2px solid var(--violet); outline-offset: 3px; }

  @keyframes breathe {
    0%, 100% { opacity: .85; transform: scale(1);    }
    50%      { opacity: 1;   transform: scale(1.06); }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  @media (max-width: 430px) {
    body   { padding: 0; }
    .phone { width: 100%; height: 100dvh; border-radius: 0; padding: 0; }
    .screen { border-radius: 0; }
  }
</style>

<script>
  /* The band behind the mic: a stack of sine curves whose amplitude runs from
     -max to +max, gated by a two-lobe envelope that opens at 24% and 76% of
     the width and closes to nothing behind the button itself.

     It is a level meter, not decoration. Tap the mic: the band takes its
     height from the voice and its curves travel. Tap again and it lies down
     flat, because that is the only honest thing a meter can do at silence. */
  (function () {
    const W = 390, CY = 96;
    const LINES = 13, MAX_AMP = 30, STEP = 8;
    const FRAME_MS = 33, SPEED = 2.4, SILENT = 0.004;

    const group = document.getElementById('waveLines');
    const stage = document.getElementById('micStage');
    const btn   = document.getElementById('micBtn');
    const hint  = document.getElementById('hint');

    /* Solved once: the envelope never changes, only amplitude and phase do. */
    const xs = [];
    for (let x = 0; x < W; x += STEP) xs.push(x);
    xs.push(W);

    const env = xs.map(function (x) {
      const t = x / W;
      const left  = Math.exp(-Math.pow((t - 0.24) / 0.135, 2));
      const right = Math.exp(-Math.pow((t - 0.76) / 0.135, 2));
      return (left + right) * Math.pow(Math.sin(Math.PI * t), 0.55);
    });

    /* One <path> per curve, created once and then only ever re-pointed. */
    const nodes = [];
    for (let i = -LINES; i <= LINES; i++) {
      const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      p.setAttribute('opacity', (0.1 + 0.26 * (1 - Math.abs(i / LINES))).toFixed(3));
      group.appendChild(p);
      nodes.push(p);
    }

    /* Bursts and gaps from oscillators that never line up — it reads like
       speech without asking the browser for a microphone. */
    function speechLevel(t) {
      const burst = Math.sin(t * 1.7) * 0.5 + Math.sin(t * 0.9 + 1.3) * 0.35 + 0.32;
      const grain = 0.62 + 0.38 * Math.sin(t * 11.3) * Math.sin(t * 7.1 + 0.5);
      return Math.max(0, Math.min(1, burst * grain));
    }

    let listening = false, amp = 0, phase = 0;
    let raf = 0, lastFrame = 0, lastDrawn = 0, closed = false;

    function draw() {
      for (let i = -LINES; i <= LINES; i++) {
        const k = i / LINES;
        const a = MAX_AMP * k * amp;
        const w = (2 * Math.PI * (3.1 + Math.abs(k) * 0.9)) / W;
        const drift = i * 0.34 + phase * (1 + Math.abs(k) * 0.25);

        let d = '';
        for (let j = 0; j < xs.length; j++) {
          const y = CY + a * env[j] * Math.sin(w * xs[j] + drift);
          d += (j === 0 ? 'M' : 'L') + xs[j] + ' ' + (Math.round(y * 10) / 10);
        }
        nodes[i + LINES].setAttribute('d', d);
      }
      /* Fading it out as it closes hides the seam: 27 curves collapsed onto
         one line stack into a bar far darker than the line they become. */
      group.setAttribute('opacity', Math.min(1, amp * 4).toFixed(3));
    }

    function tick(now) {
      const dt = lastFrame ? Math.min((now - lastFrame) / 1000, 0.1) : 0;
      lastFrame = now;

      const target = listening ? speechLevel(now / 1000) : 0;
      /* Fast up, slow down — a meter that fell as fast as it rose would
         flicker on every gap between words. */
      amp += (target - amp) * (target > amp ? 0.35 : 0.1);
      phase += dt * SPEED;

      const quiet = amp < SILENT;
      if (quiet) {
        amp = 0;
        if (!closed) { closed = true; draw(); }
        /* Closed and nobody talking — nothing reopens it until the button
           does, and that restarts the loop. */
        if (!listening) { raf = 0; return; }
      } else {
        closed = false;
      }

      raf = requestAnimationFrame(tick);
      if (quiet || now - lastDrawn < FRAME_MS) return;
      lastDrawn = now;
      draw();
    }

    draw();

    btn.addEventListener('click', function () {
      listening = !listening;
      btn.setAttribute('aria-pressed', String(listening));
      stage.classList.toggle('on', listening);
      hint.textContent = listening ? 'מקשיבה…' : 'הקשיבו / דברו';
      lastFrame = 0;
      if (!raf) raf = requestAnimationFrame(tick);
    });

    /* Motes drifting off the band. Fixed offsets, so the render is stable. */
    const motes = [
      [64, 52, 1.1, .30], [108, 132, 1.4, .26], [148, 40, 1.0, .34],
      [232, 46, 1.2, .30], [286, 128, 1.3, .24], [318, 66, 1.0, .28],
      [196, 24, 1.1, .22], [258, 150, 1.0, .20], [92, 158, 1.2, .18]
    ];
    document.getElementById('waveDots').innerHTML = motes
      .map(m => '<circle cx="' + m[0] + '" cy="' + m[1] + '" r="' + m[2] + '" opacity="' + m[3] + '"/>')
      .join('');
  })();
</script>
